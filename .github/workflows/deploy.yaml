name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Run Application Regression Tests
        run: npm run test:app

      - name: Install CDK Dependencies
        working-directory: cdk
        run: npm ci

      - name: Run CDK Regression Tests
        working-directory: cdk
        run: npm test

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5.1.1
        with:
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: deploy-c19yamamoto-com-${{ github.run_id }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}

      - name: Deploy CDK Stack
        working-directory: cdk
        run: npx cdk deploy --all --require-approval never -c domainName=c19yamamoto.com
