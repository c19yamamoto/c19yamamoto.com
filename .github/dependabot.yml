version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    schedule:
      interval: weekly
      day: saturday
      time: "12:00"
      timezone: Asia/Tokyo
    groups:
      root-npm:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/cdk"
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps-dev)"
    schedule:
      interval: weekly
      day: saturday
      time: "12:00"
      timezone: Asia/Tokyo
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      cdk-npm:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    commit-message:
      prefix: "ci(deps)"
    schedule:
      interval: weekly
      day: saturday
      time: "12:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns:
          - "*"
